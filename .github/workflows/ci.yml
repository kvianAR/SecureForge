name: Core foundation tests
on:
  push:
    branches: [main, feat/core-agent]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Check high-severity dependency advisories
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run demo:inspect -- 'TrueForge'
      # Package once on Linux to catch missing manifest/media/bundle assets.
      # VS Code UI tests still require a separate real editor-host qualification.
      - name: Build installable VSIX
        if: runner.os == 'Linux'
        run: npm run package:extension
      - name: Validate VSIX contents
        id: vsix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="outputs/SecureForge-$(node -p "require('./extension/package.json').version").vsix"
          test -s "$archive"
          unzip -Z1 "$archive" | grep -Fx 'extension/package.json'
          unzip -Z1 "$archive" | grep -Fx 'extension/extension.cjs'
          unzip -Z1 "$archive" | grep -Fx 'extension/dist/extension.mjs'
          unzip -Z1 "$archive" | grep -Fx 'extension/media/secureforge.svg'
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Retain candidate VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: secureforge-vsix-candidate
          path: ${{ steps.vsix.outputs.archive }}
          if-no-files-found: error
